<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych Chart Converter</title>
<style>
    body { font-family: Arial, sans-serif; background: #000000; color: #eee; padding: 20px; }
    h1 { color: #0000ff; }
    input, button { margin-top: 10px; padding: 8px; font-size: 16px; }
    #dropArea {
        margin-top: 20px;
        padding: 40px;
        border: 2px dashed #0000ff;
        text-align: center;
        color: #aaa;
        transition: background 0.3s;
    }
    #dropArea.dragover { background: #000000; color: #0000ff; }
    pre { background: #222; padding: 10px; overflow-x: auto; max-height: 300px; white-space: pre-wrap; }
    .success { color: #00ff00; }
    .error { color: #ff5555; }
</style>
</head>
<body>
<h1>Psych Chart Converter</h1>
<p>Drag and drop JSON files or click to select multiple files.</p>

<input type="file" id="fileInput" accept=".json" multiple>
<div id="dropArea">Or drag and drop the files here.</div>

<pre id="output"></pre>

<script>
const dropArea = document.getElementById('dropArea');
const fileInput = document.getElementById('fileInput');
const output = document.getElementById('output');

// Previne comportamento padrão para drag & drop
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, e => e.preventDefault());
    document.body.addEventListener(eventName, e => e.preventDefault());
});

dropArea.addEventListener('dragover', () => dropArea.classList.add('dragover'));
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
dropArea.addEventListener('drop', e => {
    dropArea.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
    output.textContent = '';
    for (let file of files) {
        if (!file.name.endsWith('.json')) {
            output.textContent += `❌ Ignoring ${file.name} (not JSON)\n`;
            continue;
        }
        convertFile(file);
    }
}

function convertFile(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            let chart = JSON.parse(e.target.result);

            // Converte notas
            if (chart.notes) {
                chart.notes.forEach(section => {
                    if (section.sectionNotes && section.sectionNotes.length > 0) {
                        section.sectionNotes.forEach(notes => {
                            if (!section.mustHitSection) {
                                if (notes[1] > 3) notes[1] = notes[1] % 4;
                                else notes[1] += 4;
                            }
                        });
                    }
                });
            }

            // Marca formato
            chart.format = 'Psych_Chart_Converter';

            const finalJson = JSON.stringify({ song: chart }, null, 4);

            // Define nome do arquivo convertido
            let fileName = file.name === "events.json" ? "-events.json" : file.name;

            // Cria download
            const blob = new Blob([finalJson], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            a.click();

            output.textContent += `✅ ${file.name} converted successfully!\n`;
            output.className = "success";
        } catch (err) {
            output.textContent += `❌ Error converting ${file.name}: ${err}\n`;
            output.className = "error";
        }
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
